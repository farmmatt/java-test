# ============================================================================
# Gradle 9 Workspace Configuration (Copied & Committed to Project Repository)
# ============================================================================

# --- Multi-Core & Parallel Execution ---
org.gradle.parallel=true
org.gradle.workers.max=16

# --- Build & Configuration Caching ---
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# --- Daemon & File System Watching ---
org.gradle.daemon=true
org.gradle.vfs.watch=true

# --- JVM Memory & GC Tuning for Java 21 ---
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# --- Java 21 Toolchain Auto-Detection ---
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

schema: spec-driven-reviewed

context: |
  Tech stack: Java 21, Gradle 9 (Groovy DSL — no Kotlin, TOML Version Catalog in gradle/libs.versions.toml), SLF4J/Logback, JUnit 5, AssertJ
  Vendored Specs & Schemas (Copy In, Don't Link Out):
    - Agent Skills specification: .agents/spec/specification.md & .agents/spec/best-practices.md
    - OpenSpec schemas: openspec/schemas/spec-driven-reviewed/schema.yaml & openspec/schemas/spec-driven/schema.yaml
  Strict Role Boundaries (Non-Negotiable):
    - Designer / Reviewer (first-principles-thinking, java-architect, openspec-reviewer): NEVER writes production or test code. Defines specs, deep module interfaces, and Pre-Agreed Test Seams.
    - Developer (java-expert + test-driven-development): Sole code author. Executes vertical Red -> Green slices at pre-agreed seams and applies refactoring recommendations fed back by code-review-expert.
    - Code Reviewer (code-review-expert): NEVER writes or edits code. Runs the Two-Axis Review (Spec/Seams + Standards/TDD Honesty/Fowler Code Smells) and feeds concrete refactoring tasks back to java-expert.
  Architecture: Keep domain models framework-agnostic (domain/); place orchestration in service/; wire dependencies via constructor injection in config/; test only at pre-agreed public seams
  Personas & Skills (.agents/skills/<name>/SKILL.md — unified single-file skills formatted per .agents/spec/specification.md):
    - first-principles-thinking (.agents/skills/first-principles-thinking/SKILL.md): Deconstructs problems to fundamental truths and challenges assumptions during proposal and design (No-Code Role)
    - java-architect (.agents/skills/java-architect/SKILL.md): Designs deep module interfaces, dependency categories, and Confirmed Test Seams in design.md (No-Code Role)
    - openspec-reviewer (.agents/skills/openspec-reviewer/SKILL.md): Produces review.md (OPTIMAL / IMPROVABLE / RETHINK) and enforces seam and vertical-slice gates across proposal.md, specs/, design.md, and tasks.md (No-Code Role)
    - test-driven-development (.agents/skills/test-driven-development/SKILL.md): Enforces the Iron Law (no production code without a failing test first), pre-agreed test seams, vertical tracer-bullet slices (Red -> Verify Red -> Green -> Verify Green + Mutation Check), and reviewer-driven refactoring
    - java-expert (.agents/skills/java-expert/SKILL.md): Developer Agent that executes the Red -> Green TDD loop in Java 21 + Gradle 9 Groovy DSL + JUnit 5/AssertJ and applies refactorings suggested by code-review-expert
    - code-review-expert (.agents/skills/code-review-expert/SKILL.md): Read-only Two-Axis Reviewer that audits Spec/Seam compliance and Fowler code smells, feeding refactoring tasks back to java-expert (No-Code Role)
    - readme-generator (.agents/skills/readme-generator/SKILL.md): Maintains zero-hallucination README.md and package-info.java documentation
    - git-workflow-manager (.agents/skills/git-workflow-manager/SKILL.md): Manages branching and Conventional Commits linked to OpenSpec changes
    - cicd-expert (.agents/skills/cicd-expert/SKILL.md): Maintains CI/CD workflows and Gradle build caching
  Conventions:
    - Use constructor injection, Java 21 records for immutable DTOs/value objects, and clear domain naming
    - Centralize all dependency versions in gradle/libs.versions.toml
    - Use Groovy DSL (build.gradle & settings.gradle) exclusively — never Kotlin
  Verification: Every new capability is built test-first at a pre-agreed seam via './gradlew check' (or 'gwcheck'), audited by code-review-expert, and refactored by java-expert while staying green

rules:
  proposal:
    - Activate first-principles-thinking (.agents/skills/first-principles-thinking/SKILL.md) to challenge assumptions and isolate fundamental domain truths (never write code)
    - Reference openspec/project.md and identify affected layers (config, domain, service)
    - Pass the openspec-reviewer Gate 1 check before advancing
  review:
    - Activate openspec-reviewer (.agents/skills/openspec-reviewer/SKILL.md) and template openspec/schemas/spec-driven-reviewed/templates/review.md
    - Evaluate Problem Validity, Scope Discipline, Codebase Reality Check, Risk Assessment, and Alternatives
    - Record an explicit verdict (OPTIMAL, IMPROVABLE, or RETHINK) before creating specs or design
  specs:
    - Use Given/When/Then format with independent literal expected values for all scenarios and edge cases
    - Propose the public test seam(s) (with what each seam catches and misses) in the Proposed Test Seams section
    - Incorporate all accepted recommendations from review.md and pass the openspec-reviewer Gate 2 check
  design:
    - Activate java-architect (.agents/skills/java-architect/SKILL.md) and first-principles-thinking to design deep modules using "Design It Twice" (never write production or test code)
    - Keep domain models framework-agnostic using Java 21 records and constructor injection
    - Lock in the Confirmed Test Seams table before advancing and pass the openspec-reviewer Gate 3 check
  tasks:
    - Break work into vertical tracer-bullet slices per confirmed seam (RED -> Verify RED -> GREEN -> Verify GREEN + Mutation Check) executed by java-expert + test-driven-development
    - Never use horizontal slicing ("write all code then write all tests")
    - Pass the openspec-reviewer Gate 4 check before starting implementation
    - End every task list with a read-only code-review-expert Two-Axis Audit that feeds refactoring suggestions back to java-expert, followed by './gradlew check', readme-generator sync, and git-workflow-manager commit
